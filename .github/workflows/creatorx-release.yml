name: CreatorX release

on:
  push:
    tags: ['creatorx-v*']
  workflow_dispatch:
    inputs:
      version:
        description: CreatorX version without prefix
        required: true
        type: string
      notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: creatorx-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Validate source version and notes
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node scripts/validate-release.mjs --release
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = `creatorx-v${version}`;
          if (process.env.GITHUB_EVENT_NAME === 'push') assert.equal(process.env.GITHUB_REF_NAME, tag);
          else assert.equal(process.env.REQUESTED_VERSION, version);
          const notes = process.env.RELEASE_NOTES?.trim() || `CreatorX ${version}`;
          assert(notes.length > 0 && notes.length <= 8000 && !/[\u0000-\u0008\u000b-\u001f\u007f-\u009f]/u.test(notes));
          fs.mkdirSync('release-metadata');
          fs.writeFileSync('release-metadata/notes.md', `${notes}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\nsha=${process.env.GITHUB_SHA}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creatorx-metadata
          path: desktop/release-metadata/
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: desktop/src-tauri -> target
          key: creatorx-${{ matrix.target }}
      - run: npm ci
      - run: npm run verify && npm test
      - name: Build signed update artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CREATORX_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY?.trim()) throw new Error('CreatorX updater signing key is missing')"
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Stage platform artifacts
        run: node scripts/validate-release.mjs --stage --platform ${{ matrix.platform }} --bundle-dir src-tauri/target/${{ matrix.target }}/release/bundle --output-dir staged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: creatorx-${{ matrix.platform }}
          path: desktop/staged/
          if-no-files-found: error

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: creatorx-metadata
          path: desktop/release-metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: creatorx-darwin-*
          merge-multiple: true
          path: desktop/downloaded
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: creatorx-windows-x86_64
          path: desktop/downloaded
      - name: Verify every update signature and assemble manifest
        run: node scripts/validate-release.mjs --assemble --version ${{ needs.prepare.outputs.version }} --tag ${{ needs.prepare.outputs.tag }} --artifacts-dir downloaded --output-dir release --notes-file release-metadata/notes.md
      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "CreatorX $RELEASE_TAG" --notes-file release-metadata/notes.md --draft

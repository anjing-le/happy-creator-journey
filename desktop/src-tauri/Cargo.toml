[package]
name = "creatorx"
version = "0.0.9"
description = "Anjing CreatorX desktop workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "creatorx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "=2.12.0", features = ["protocol-asset"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

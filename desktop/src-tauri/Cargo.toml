[package]
name = "creatorx"
version = "0.0.2"
description = "Anjing CreatorX desktop workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "creatorx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-updater = "=2.13.1"
